name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web_app/requirements.txt
      - run: pip install -r web_app/requirements.txt pytest
      - run: pytest -q

  changes:
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.filter.outputs.gpu }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gpu:
              - 'gpu_worker/**'
            web:
              - 'web_app/**'

  deploy-gpu:
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.gpu == 'true'
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal
      # Builds the container image on Modal's side; model weights are never downloaded here.
      - run: modal deploy gpu_worker/modal_worker.py
      - run: modal deploy gpu_worker/tts_worker.py

  deploy-droplet:
    needs: [test, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH (one multiplexed connection; the server rate-limits port 22)
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::DO_SSH_KEY is not a valid private key. Paste the full output of: cat ~/.ssh/canvas_deploy (including the BEGIN/END lines), not the .pub file."
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/id_deploy | cut -d' ' -f2)"
          if [ -n "$DO_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -t ed25519 "$DO_HOST" > ~/.ssh/known_hosts 2>/dev/null  # a single connection
          fi
          cat > ~/.ssh/config <<CFG
          Host droplet
            HostName $DO_HOST
            User $DO_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 300
          CFG
          chmod 600 ~/.ssh/config
          # open the shared connection once; rsync and the restart step reuse it
          for i in 1 2 3; do
            ssh -fN droplet && echo "connected" && exit 0
            echo "connect attempt $i failed; waiting 35s for the server's rate limit window"; sleep 35
          done
          echo "::error::Cannot reach the server over SSH"; exit 1

      - name: Sync web_app (keeps .env, gallery/, audio/, voices/, studio.db on the server)
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude 'gallery/' --exclude 'studio.db*' \
            --exclude '__pycache__/' --exclude 'deploy/ngrok.yml' --exclude 'prompts.local.json' --exclude 'audio/' --exclude 'voices/' \
            -e ssh web_app/ droplet:/opt/canvas-studio/web_app/

      - name: Install deps and restart
        run: |
          ssh droplet '
            set -e
            cd /opt/canvas-studio
            [ -x venv/bin/python ] || python3 -m venv venv
            venv/bin/pip install -q --disable-pip-version-check -r web_app/requirements.txt
            sudo systemctl restart canvas-studio
            for i in $(seq 30); do
              curl -fsS -o /dev/null http://127.0.0.1:8090/robots.txt && echo "canvas-studio is up" && exit 0
              sleep 1
            done
            echo "canvas-studio did not come up"; systemctl status canvas-studio --no-pager -n 20; exit 1
          '

      - name: Close SSH connection
        if: always()
        run: ssh -O exit droplet 2>/dev/null || true
