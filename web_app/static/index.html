<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Canvas">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Canvas</title>
<style>
  :root {
    --bg: #0d0d10; --panel: #16161b; --panel2: #1e1e25; --line: #2a2a33;
    --text: #ececf1; --muted: #8b8b98; --accent: #c9b8ff; --accent-ink: #15121f;
    --danger: #ff8a8a; --ok: #9be3b5; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  .badge { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: .6px; }
  textarea, input[type=text], input[type=password], input[type=number], select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none; }
  textarea { min-height: 120px; resize: vertical; }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .seg { display: flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn { border: 1px solid var(--line); background: var(--panel2); padding: 11px 14px; border-radius: 10px; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; width: 100%; margin-top: 16px; padding: 14px; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .btn.small { padding: 6px 10px; font-size: 13px; }
  .btn.danger { color: var(--danger); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .msg { margin-top: 12px; font-size: 14px; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
  .progress { margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--panel2); border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
  .progress .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  .progress .bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .tile img { width: 100%; display: block; background: var(--panel2); cursor: zoom-in; }
  .tile .meta { padding: 8px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  .tile .p { color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13,13,16,.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { flex: 1; background: none; border: 0; padding: 14px 0 12px; color: var(--muted); cursor: pointer; font-size: 14px; }
  nav button.on { color: var(--accent); font-weight: 600; }
  .chatlog { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .bubble { padding: 10px 12px; border-radius: 12px; max-width: 88%; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
  .bubble.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .lightbox img { max-width: 100%; max-height: 100%; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 14px; }
  .login { max-width: 360px; margin: 18vh auto 0; }
</style>
</head>
<body>

<!-- Login -->
<section id="login" class="wrap hidden">
  <div class="login card">
    <h1 style="margin:0 0 6px">Canvas</h1>
    <div class="hint">Private workspace. Sign in to continue.</div>
    <form id="loginForm">
      <label for="lu">Username</label>
      <input id="lu" type="text" autocomplete="username" autocapitalize="none" required>
      <label for="lp">Password</label>
      <input id="lp" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Sign in</button>
      <div id="loginMsg" class="msg err"></div>
    </form>
  </div>
</section>

<!-- App -->
<section id="app" class="hidden">
  <div class="wrap">
    <header>
      <h1>Canvas</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="usage" class="badge">GPU —</span>
        <button id="logout" class="btn small">Sign out</button>
      </div>
    </header>

    <!-- Studio -->
    <div id="tab-studio">
      <div class="card">
        <label for="prompt">Prompt</label>
        <textarea id="prompt" placeholder="Describe the image you want…"></textarea>
        <div class="row" style="margin-top:8px">
          <button id="enhance" class="btn small" type="button">Optimize Prompt</button>
          <span id="enhanceInfo" class="hint" style="align-self:center"></span>
        </div>

        <label>Aspect</label>
        <div class="seg" id="aspect">
          <button data-v="9:16" class="on">9:16</button><button data-v="1:1">1:1</button>
          <button data-v="16:9">16:9</button><button data-v="draft">Draft</button>
        </div>

        <label>Variations</label>
        <div class="seg" id="count">
          <button data-v="1">1</button><button data-v="2" class="on">2</button>
          <button data-v="3">3</button><button data-v="4">4</button>
        </div>
        <div class="hint">One GPU wake-up renders all variations — extra picks cost only a few seconds.</div>

        <label>Style Mode</label>
        <div class="seg" id="styleMode">
          <button data-v="0" class="on">Standard (0.0)</button><button data-v="0.8">Custom (0.8)</button>
        </div>
        <input id="styleScale" type="range" min="0" max="1" step="0.05" value="0">
        <div class="hint">Strength: <span id="styleVal">0.00</span></div>

        <details>
          <summary>Advanced</summary>
          <div class="row">
            <div>
              <label for="seed">Seed (optional)</label>
              <input id="seed" type="number" min="0" max="4294967295" placeholder="random">
            </div>
            <div>
              <label for="steps">Steps: <span id="stepsVal">9</span></label>
              <input id="steps" type="range" min="4" max="12" step="1" value="9">
            </div>
          </div>
        </details>

        <button id="generate" class="btn primary">Generate</button>
        <div id="progress" class="progress hidden"><span id="progressText"></span><div class="bar"><i></i></div></div>
        <div id="genMsg" class="msg"></div>
      </div>
      <div id="results" class="grid"></div>
    </div>

    <!-- Gallery -->
    <div id="tab-gallery" class="hidden">
      <div id="galleryEmpty" class="hint" style="margin-top:20px">No renders yet.</div>
      <div id="gallery" class="grid"></div>
    </div>

    <!-- Chat -->
    <div id="tab-chat" class="hidden">
      <div class="hint" style="margin-top:14px">Story chat. History stays in this tab only and is cleared on reload.</div>
      <div id="chatlog" class="chatlog"></div>
      <div class="card">
        <textarea id="chatIn" placeholder="Write a message…" style="min-height:70px"></textarea>
        <div class="row" style="margin-top:8px">
          <button id="chatClear" class="btn small" type="button">Clear</button>
          <button id="chatSend" class="btn" type="button" style="font-weight:600">Send</button>
        </div>
        <div id="chatMsg" class="msg err"></div>
      </div>
    </div>
  </div>

  <nav>
    <button data-tab="studio" class="on">Studio</button>
    <button data-tab="gallery">Gallery</button>
    <button data-tab="chat" id="navChat" class="hidden">Chat</button>
  </nav>
</section>

<div id="lightbox" class="lightbox hidden"><img alt=""></div>

<script>
const $ = (s) => document.querySelector(s);
const state = { aspect: "9:16", count: 2, chat: [], me: null };

async function api(path, opts = {}) {
  const headers = { "X-Requested-With": "canvas", ...(opts.body ? { "Content-Type": "application/json" } : {}) };
  const res = await fetch(path, { credentials: "same-origin", ...opts, headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401 && path !== "/api/login") { show("login"); throw new Error("Please sign in."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : `Error ${res.status}`);
  }
  return data;
}

function show(view) {
  $("#login").classList.toggle("hidden", view !== "login");
  $("#app").classList.toggle("hidden", view !== "app");
}

function setUsage(u) {
  if (!u) return;
  $("#usage").textContent = `GPU ${u.gpu_minutes_total} / ${u.gpu_minutes_cap} min`;
  $("#usage").title = `You: ${u.gpu_minutes_user} min this month (estimated)`;
}

function segment(id, onPick) {
  const el = $(id);
  el.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    onPick(b.dataset.v);
  });
  return (v) => el.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === String(v)));
}
const setAspect = segment("#aspect", v => state.aspect = v);
const setCount = segment("#count", v => state.count = +v);
const setStyleMode = segment("#styleMode", v => setStyle(+v, false));

function setStyle(v, fromSlider = true) {
  $("#styleScale").value = v;
  $("#styleVal").textContent = (+v).toFixed(2);
  if (fromSlider) setStyleMode(+v === 0 ? 0 : (+v === 0.8 ? 0.8 : "none"));
}
$("#styleScale").addEventListener("input", e => setStyle(e.target.value));
$("#steps").addEventListener("input", e => $("#stepsVal").textContent = e.target.value);

// ---- auth
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginMsg").textContent = "";
  try {
    await api("/api/login", { method: "POST", body: { username: $("#lu").value, password: $("#lp").value } });
    $("#lp").value = "";
    await boot();
  } catch (err) { $("#loginMsg").textContent = err.message; }
});
$("#logout").addEventListener("click", async () => {
  await api("/api/logout", { method: "POST", body: {} }).catch(() => {});
  show("login");
});

// ---- tabs
document.querySelector("nav").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ["studio", "gallery", "chat"].forEach(t => $("#tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
  if (b.dataset.tab === "gallery") loadGallery();
});

// ---- enhance
$("#enhance").addEventListener("click", async () => {
  const p = $("#prompt").value.trim();
  if (!p) return;
  const btn = $("#enhance"); btn.disabled = true; $("#enhanceInfo").textContent = "Optimizing…";
  try {
    const r = await api("/api/enhance-prompt", { method: "POST", body: { prompt: p } });
    $("#prompt").value = r.prompt;
    const fixes = r.changes.length ? ` · ${r.changes.length} negation${r.changes.length > 1 ? "s" : ""} rewritten` : "";
    $("#enhanceInfo").textContent = `${r.words} words (${r.source})${fixes} — review & edit before generating`;
  } catch (err) { $("#enhanceInfo").textContent = err.message; }
  finally { btn.disabled = false; }
});

// ---- generate
let timer = null;
$("#generate").addEventListener("click", async () => {
  const prompt = $("#prompt").value.trim();
  if (!prompt) { $("#genMsg").className = "msg err"; $("#genMsg").textContent = "Write a prompt first."; return; }
  const seedRaw = $("#seed").value.trim();
  const body = {
    prompt, aspect: state.aspect, count: state.count,
    steps: +$("#steps").value, adapter_scale: +$("#styleScale").value,
    seed: seedRaw === "" ? null : +seedRaw,
  };
  const btn = $("#generate"); btn.disabled = true;
  $("#genMsg").textContent = "";
  const t0 = Date.now();
  $("#progress").classList.remove("hidden");
  const tick = () => {
    const s = Math.round((Date.now() - t0) / 1000);
    $("#progressText").textContent = `Rendering… ~60s if the GPU is asleep, then ~20s per image (Draft is faster). ${s}s`;
  };
  tick(); timer = setInterval(tick, 1000);
  try {
    const r = await api("/api/generate", { method: "POST", body });
    $("#results").innerHTML = "";
    r.images.forEach(img => $("#results").appendChild(tile({ ...img, prompt, aspect: body.aspect,
      steps: body.steps, adapter_scale: body.adapter_scale }, false)));
    setUsage(r.usage);
    $("#genMsg").className = "msg ok";
    $("#genMsg").textContent = `${r.images.length} image(s) in ${Math.round((Date.now() - t0) / 1000)}s` +
      (r.cold_start ? " (cold start)" : "") + ` · ~${r.estimated_gpu_sec}s GPU`;
  } catch (err) {
    $("#genMsg").className = "msg err"; $("#genMsg").textContent = err.message;
  } finally {
    clearInterval(timer); $("#progress").classList.add("hidden"); btn.disabled = false;
  }
});

// ---- tiles / gallery
function tile(it, withDelete) {
  const d = document.createElement("div"); d.className = "tile";
  const img = document.createElement("img"); img.loading = "lazy"; img.src = it.url; img.alt = "";
  img.addEventListener("click", () => { $("#lightbox img").src = it.url; $("#lightbox").classList.remove("hidden"); });
  const meta = document.createElement("div"); meta.className = "meta";
  const p = document.createElement("div"); p.className = "p"; p.textContent = it.prompt || "";
  const s = document.createElement("div"); s.textContent = `seed ${it.seed} · ${it.aspect || ""}`;
  const acts = document.createElement("div"); acts.className = "acts";
  const dl = document.createElement("a"); dl.className = "btn small"; dl.textContent = "Download";
  dl.href = it.url + "?download=1"; dl.setAttribute("download", it.filename || "");
  const reuse = document.createElement("button"); reuse.className = "btn small"; reuse.textContent = "Reuse Seed";
  reuse.addEventListener("click", () => reuseSeed(it));
  acts.append(dl, reuse);
  if (withDelete) {
    const del = document.createElement("button"); del.className = "btn small danger"; del.textContent = "Delete";
    del.addEventListener("click", async () => {
      if (!confirm("Delete this image?")) return;
      try { await api(`/api/image/${encodeURIComponent(it.filename)}`, { method: "DELETE" }); d.remove(); }
      catch (err) { alert(err.message); }
    });
    acts.append(del);
  }
  meta.append(p, s, acts); d.append(img, meta);
  return d;
}

function reuseSeed(it) {
  $("#prompt").value = it.prompt || $("#prompt").value;
  $("#seed").value = it.seed;
  if (it.aspect) { state.aspect = it.aspect; setAspect(it.aspect); }
  if (it.steps) { $("#steps").value = it.steps; $("#stepsVal").textContent = it.steps; }
  if (it.adapter_scale !== undefined) setStyle(it.adapter_scale);
  state.count = 1; setCount(1);
  document.querySelector('nav button[data-tab="studio"]').click();
  document.querySelector("details").open = true;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function loadGallery() {
  try {
    const r = await api("/api/gallery");
    const g = $("#gallery"); g.innerHTML = "";
    r.items.forEach(it => g.appendChild(tile(it, true)));
    $("#galleryEmpty").classList.toggle("hidden", r.items.length > 0);
    setUsage(r.usage);
  } catch (err) { $("#galleryEmpty").textContent = err.message; }
}

$("#lightbox").addEventListener("click", () => $("#lightbox").classList.add("hidden"));

// ---- chat
function renderChat() {
  const log = $("#chatlog"); log.innerHTML = "";
  state.chat.forEach(m => {
    const b = document.createElement("div"); b.className = "bubble " + m.role; b.textContent = m.content;
    log.appendChild(b);
  });
  window.scrollTo({ top: document.body.scrollHeight });
}
$("#chatSend").addEventListener("click", async () => {
  const text = $("#chatIn").value.trim(); if (!text) return;
  state.chat.push({ role: "user", content: text }); $("#chatIn").value = ""; renderChat();
  const btn = $("#chatSend"); btn.disabled = true; $("#chatMsg").textContent = "";
  try {
    const r = await api("/api/chat", { method: "POST", body: { messages: state.chat.slice(-60) } });
    state.chat.push({ role: "assistant", content: r.reply }); renderChat();
  } catch (err) { $("#chatMsg").textContent = err.message; state.chat.pop(); renderChat(); $("#chatIn").value = text; }
  finally { btn.disabled = false; }
});
$("#chatClear").addEventListener("click", () => { state.chat = []; renderChat(); });

// ---- boot
async function boot() {
  try {
    const me = await api("/api/me");
    state.me = me;
    $("#navChat").classList.toggle("hidden", !me.chat_enabled);
    setUsage(me.usage);
    show("app");
  } catch { show("login"); }
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
boot();
</script>
</body>
</html>
